<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype S9 — Weather sim</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b2630;
        color: #e8eef2;
        font:
          13px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 280px;
        grid-template-rows: minmax(0, 1fr) 190px;
        gap: 8px;
        height: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #13202a;
        border-radius: 4px;
      }
      .cell {
        position: relative;
        min-height: 0;
      }
      .label {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 12px;
        color: #b9c7d1;
        pointer-events: none;
      }
      #strip-cell {
        grid-column: 1 / 3;
      }
      #panel {
        grid-row: 1 / 3;
        grid-column: 3;
        overflow: auto;
        background: #13202a;
        border-radius: 4px;
        padding: 10px 12px;
      }
      #panel h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      #panel .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
        flex-wrap: wrap;
      }
      #panel button,
      #panel select,
      #panel input {
        font: inherit;
        background: #24343f;
        color: inherit;
        border: 1px solid #3a4d5a;
        border-radius: 3px;
        padding: 2px 6px;
      }
      #instruments {
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre;
        margin-top: 10px;
      }
      #legend {
        margin-top: 12px;
        font-size: 12px;
        color: #b9c7d1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="cell">
        <canvas id="synoptic"></canvas>
        <div class="label">
          Synoptic chart: isobars every 4 hPa; L and H show each system's own strength
        </div>
      </div>
      <div class="cell">
        <canvas id="lake"></canvas>
        <div class="label">Western Lake Superior (cut at 90° W): wind, rain and fog</div>
      </div>
      <div class="cell" id="strip-cell">
        <canvas id="strip"></canvas>
        <div class="label">
          Season at the selected probe: pressure (amber), wind (white), visibility under 1 km from
          fog or rain (grey), gales (red). Click to jump.
        </div>
      </div>
      <div id="panel"></div>
    </div>
    <!-- Dev-only page for prototype S9 (plan 04 §20); not part of the production build. -->
    <script type="module" src="/src/debug/weather-sim/main.ts"></script>
  </body>
</html>
