<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart redraw bench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e9dcbb;
      }
      #chart {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #out {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #e8eef0;
        background: rgba(15, 25, 32, 0.8);
        white-space: pre;
      }
    </style>
  </head>
  <body data-bench="running">
    <canvas id="chart"></canvas>
    <pre id="out">Running…</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
