<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schooner contact sheet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10181d;
        color: #dde6ea;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        display: block;
      }
      #labels {
        position: fixed;
        inset: 0;
        display: grid;
        pointer-events: none;
      }
      #labels div {
        padding: 6px 8px;
        text-shadow: 0 1px 2px #000;
        border: 1px solid rgb(0 0 0 / 35%);
      }
    </style>
  </head>
  <body data-sheet="starting">
    <div id="stage"></div>
    <div id="labels"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
